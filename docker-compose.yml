version: '3.8'

services:
  api:
    build: .
    container_name: fastapi-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./src:/app/src
      - ./frontend:/app/frontend

  frontend:
    build: ./frontend/maxapp
    container_name: frontend-app
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped
    volumes:
      - ./frontend/maxapp:/app
      - /app/node_modules
